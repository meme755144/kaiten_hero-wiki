<!-- 啟用 Katex 數學公式支援 -->
{% assign math = page.math | default: layout.math | default: site.math %}

{% case math %}
  {% when "katex" %}
    {% include katex.html %}
{% endcase %}
<script>
    (function () {
        /* 網頁準備載入前，先看看有沒有上次存好的亮暗記憶 */
        var savedTheme = localStorage.getItem('jtd-theme');
        if (savedTheme && typeof jtd !== 'undefined') {
            jtd.setTheme(savedTheme);
        }
    })();
</script>
