name: Auto Update Git Timestamp and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundle-cache: false 
          
      - name: Cache Ruby Gems
        uses: actions/cache@v4
        id: gem-cache
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install Dependencies (Only Runs When Cache Misses)
        run: |
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Automatically Inject Git Timestamp into Front Matter
        run: |
          echo "=== Start Dynamic Scanning ==="
          
          # 💡 使用標準的 prune 語法，絕對不碰快取夾 vendor 與 _site
          find . \( -path "./vendor" -o -path "./_site" -o -path "./.git" \) -prune -o -type f -name "*.md" -print | while read file; do
            git_date=$(git log -1 --format="%cd" --date=iso "$file")
            if [ ! -z "$git_date" ]; then
              formatted_date=$(date -d "$git_date" "+%Y-%m-%d %H:%M:%S")
              awk -v d="$formatted_date" 'NR==2{print "last_updated: \"" d "\""}1' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              echo "Success: [$formatted_date] : $file"
            fi
          done
          
          echo "=== Scan Finished ==="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
