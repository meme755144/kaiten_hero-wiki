name: Auto Update Git Timestamp and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby and Enable Cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundle-cache: true # 💡 讓官方完全接管：它會自動執行 bundle install 並保證 100% 寫入快取

      - name: Automatically Inject Git Timestamp into Front Matter
        run: |
          echo "=== 開始進行多語言資料夾全自動掃描 ==="
          
          find . \( -path "./vendor" -o -path "./_site" -o -path "./.git" \) -prune -o -type f -name "*.md" -print | while read file; do
            git_date=$(git log -1 --format="%cd" --date=iso "$file")
            if [ ! -z "$git_date" ]; then
              formatted_date=$(date -d "$git_date" "+%Y-%m-%d %H:%M:%S")
              awk -v d="$formatted_date" 'NR==2{print "last_updated: \"" d "\""}1' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              echo "✅ 成功注入時間 -> [$formatted_date] : $file"
            fi
          done
          
          echo "=== 多語言時間戳記全數注入完成 ==="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
