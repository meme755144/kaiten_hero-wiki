<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>

  <!-- 1. 把 Jekyll 資料庫轉換為 JSON 格式，保持 VS Code 畫面乾淨全綠 -->
  <script id="jekyll-languages-data" type="application/json">
    [
      
        { "code": "zh-TW", "url": "/kaiten_hero-wiki/zh-TW/" },
      
        { "code": "ja-JP", "url": "/kaiten_hero-wiki/ja-JP/" },
      
        { "code": "en", "url": "/kaiten_hero-wiki/en/" }
      
    ]
  </script>

  <script>
    /* 2. 解析語言清單與網址變數 */
    var siteLanguages = JSON.parse(document.getElementById('jekyll-languages-data').textContent);
    var currentUrl = window.location.href;
    var userLang = (navigator.language || navigator.userLanguage).toLowerCase();

    /* 3. 自動偵測防無限循環：如果網址已經包含了任何現有語系，就停止轉址 */
    var isAlreadyRedirected = false;
    for (var i = 0; i < siteLanguages.length; i++) {
      if (currentUrl.indexOf('/' + siteLanguages[i].code + '/') !== -1) {
        isAlreadyRedirected = true;
        break;
      }
    }

    /* 4. 如果真正站在大門口，觸發跨國分流 */
    if (!isAlreadyRedirected) {
      var targetUrl = "";

      /* 擷取玩家瀏覽器的前兩個主要字母（如 "zh", "ja", "en"） */
      var userMainLang = userLang.substring(0, 2);

      /* 5. 核心分流閘門：除了中日文，其餘通通派發到英文版 (en) */
      if (userMainLang === "zh") {
        var zhLang = siteLanguages.find(function (l) { return l.code === "zh-TW"; });
        targetUrl = zhLang ? zhLang.url : "";
      } else if (userMainLang === "ja") {
        var jaLang = siteLanguages.find(function (l) { return l.code === "ja-JP"; });
        targetUrl = jaLang ? jaLang.url : "";
      }

      /* 6. 安全防禦：如果上面找不到對應（比如是德文、法文、韓文，或找不到中日文資料夾），一律強制轉英文 */
      if (!targetUrl) {
        var enLang = siteLanguages.find(function (l) { return l.code === "en"; });
        /* 萬一專案裡連英文資料夾都還沒開，就保險拿清單第一個語系當墊底 */
        targetUrl = enLang ? enLang.url : siteLanguages[0].url;
      }

      window.location.replace(targetUrl);
    }
  </script>
</head>

<body style="background-color: #111111;">
</body>

</html>
