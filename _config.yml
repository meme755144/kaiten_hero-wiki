title: "廻転勇者 Wiki"
description: "廻転勇者 多語言遊戲知識庫"

# 遠端主題設定
remote_theme: "just-the-docs/just-the-docs"

baseurl: "/kaiten_hero-wiki" # 如果是個人主頁儲存庫，請填 ""
url: "https://github.io"

# 導覽與搜尋設定
search_enabled: true
heading_anchors: true

color_scheme: light
color_schemes:
  light: default
  dark: dark

# 讓 GitHub Pages 允許遠端載入主題
plugins:
  - jekyll-remote-theme

exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock

# 網站目前支援的語言清單（未來想增加語言，只要在這邊多加一行就好！）
languages:
  - code: "zh-TW"
    label: "繁體中文"
    flag: "🇹🇼"
    home_url: "/zh-TW/"
  - code: "ja-JP"
    label: "日本語"
    flag: "🇯🇵"
    home_url: "/ja-JP/"
  - code: "en"         # 未來想開英文版時，只要把這兩行的註解 # 拿掉就自動生效！
    label: "English"
    flag: "🇺🇸"
    home_url: "/en/"